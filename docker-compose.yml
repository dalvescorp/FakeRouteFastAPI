version: '3.8'
services:
  fakeroute:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - FAKES_FILE=/app/fakes.json
      - API_PORT=8000
      - SWAGGER_USERNAME=admin
      - SWAGGER_PASSWORD=senha123
    volumes:
      - ./app/fakes.json:/app/fakes.json
      - ./:/app
  command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app --reload-include fakes.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
